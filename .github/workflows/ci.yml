name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: typecheck · lint · testes · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Falha só em erro; os warnings herdados do código pré-existente
      # não bloqueiam. Baixar esse teto é trabalho para outra PR.
      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # Prova que o material de fundamentação do avaliador (o `contexto`
      # dos loops, que contém respostas de referência) não foi parar no
      # bundle. Os testes checam o artefato; isto checa o que vai ao browser.
      - name: Sem gabarito no bundle
        run: npm run check:secrets
